name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Download and verify dataset
        env:
          DATASET_URL: ${{ vars.DATASET_URL }}
        run: |
          python scripts/download_dataset.py

      - name: Create CI test model
        run: |
          python scripts/create_ci_test_model.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          MODEL_URI: ${{ github.workspace }}/.ci/test_model
          MODEL_THRESHOLD: "0.07"
        run: |
          pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build -t telecom-churn-api:ci .